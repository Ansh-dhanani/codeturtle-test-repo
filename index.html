<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeTurtle Demo</title>
    <style>
      :root {
        --bg: #0b0f19;
        --card: #111827;
        --accent: #39a5d9;
        --text: #e5e7eb;
        --muted: #9ca3af;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        background: var(--card);
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 2rem;
        max-width: 480px;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        color: var(--accent);
      }

      p {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>CodeTurtle Demo</h1>
      <p>
        Tiny sample app used to test CodeTurtle — an AI pull request reviewer.
      </p>
    </main>
  </body>
</html>
